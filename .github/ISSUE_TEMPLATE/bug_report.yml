name: Bug Report
description: Create a report to help reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, VirtualBox version, and Python version.
      placeholder: Windows 11 23H2 / VirtualBox 7.0.18 / Python 3.11.4
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start VirtualBox
        2. Launch VM 'Ubuntu'
        3. Observe presence status in Discord
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste relevant logs from vbox_rpc.log or console output.
      render: shell
